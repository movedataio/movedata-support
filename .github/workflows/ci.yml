name: CI

on:
  push:
    branches:
      - main
      - documentation
      - developer
      - knowledgebase
      - extension/commerce
      - extension/npsp-fundraising
      - extension/non-profit-cloud
      - schema/commerce
      - schema/donation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install mkdocs-material
        run: pip3 install mkdocs-material

      - name: Build Static Site
        run: npm run build

      - name: List all contents in ./lib/site
        run: ls -al ./lib/site

      - name: Zip ./lib/site directory
        run: zip -r site.zip ./lib/site

      - name: List contents of site.zip with full paths
        run: unzip -l site.zip

      - name: Upload site.zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: site.zip

  depends: 
    needs: build
    environment: ${{ github.ref == 'refs/heads/uat' && 'uat' || 'prod' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5

      - name: Determine Environment
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          case "${GITHUB_REF##*/}" in
            uat) echo "Environment: UAT"
              echo "STAGE=uat" >> $GITHUB_ENV
              #echo "::set-env name=ENVIRONMENT::uat"
              ;;
            *) echo "Environment: ${GITHUB_BASE_REF}"
              echo "STAGE=prod" >> $GITHUB_ENV
              #echo "::set-env name=ENVIRONMENT::prod"
              ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check terraform version
        run: terraform --version

      - uses: actions/checkout@v4

      - name: Terraform Init
        id: init
        run: |
          terraform init
          terraform workspace select ${{ env.STAGE }}
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{vars.AWS_REGION}}

      - name: Terraform Validate
        id: validate
        run: |
          terraform validate
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{vars.AWS_REGION}}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out="./${{ env.STAGE }}.plan.tfplan"
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{vars.AWS_REGION}}
 
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -parallelism=30 ./${{ env.STAGE }}.plan.tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{vars.AWS_REGION}}

  deploy:
    needs: depends
    environment: ${{ github.ref == 'refs/heads/uat' && 'uat' || 'prod' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download site.zip artifact
      uses: actions/download-artifact@v4
      with:
        name: site-zip

    - name: List contents of site.zip with full paths
      run: unzip -l site.zip

    - name: Unzip site.zip
      run: unzip site.zip

    - name: List all files recursively after unzip
      run: find . -type f

    - name: Deploy to S3
      run: |
        aws s3 sync ./lib/site s3://$S3_BUCKET --delete --region $AWS_REGION
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET: ${{ vars.S3_BUCKET }}

  sync-ai:
    needs: deploy
    uses: ./.github/workflows/ai.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID }}
      KNOWLEDGE_BASE_DATA_SOURCE_ID: ${{ vars.KNOWLEDGE_BASE_DATA_SOURCE_ID }}
      KNOWLEDGE_BASE_SUPPRESS: ${{ vars.KNOWLEDGE_BASE_SUPPRESS }}
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
