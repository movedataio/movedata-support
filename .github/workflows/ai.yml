name: Sync MoveData Support Documentation

on:
  workflow_dispatch: # Allow manual trigger
  workflow_call: # Allow this workflow to be called by other workflows
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  ENVIRONMENT: uat  # Change this variable as needed
  S3_BUCKET_PATH: s3://${{ vars.ENVIRONMENT || 'uat' }}-movedata-ai/support/
  KNOWLEDGE_BASE_ID: IJDF9WCJTI
  KNOWLEDGE_BASE_DATA_SOURCE_ID: GREZAHSG06

jobs:
  sync-documentation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        
      - name: Clean and setup temporary directory
        run: |
          rm -rf ./.tmp
          mkdir ./.tmp
          cd ./.tmp
          mkdir ./extension
          mkdir ./schema

      - name: Clone MoveData support repository
        run: |
          cd ./.tmp
          git clone https://github.com/movedataio/movedata-support.git movedata-support

      - name: Copy BIN folder
        run: |
          cd ./.tmp
          cp -R movedata-support/bin ./bin

      - name: Sync documentation branch
        run: |
          cd ./.tmp/movedata-support
          git checkout documentation
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./documentation/
          cd movedata-support
          git restore .

      - name: Sync knowledge base branch
        run: |
          cd ./.tmp/movedata-support
          git checkout knowledgebase
          cd ..
          echo "Converting GitBook hints to MkDocs admonitions..."
          node ./bin/convert-hints.js ./movedata-support
          echo "Converting metadata from note blocks to frontmatter..."
          node ./bin/convert-metadata.js ./movedata-support
          echo "Generating AWS Bedrock metadata sidecar files..."
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./knowledgebase/
          cd movedata-support
          git restore .

      - name: Sync developer branch
        run: |
          cd ./.tmp/movedata-support
          git checkout developer
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./developer/
          cd movedata-support
          git restore .

      - name: Sync NPSP fundraising extension
        run: |
          cd ./.tmp/movedata-support
          git checkout extension/npsp-fundraising
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./extension/npsp-fundraising/
          cd movedata-support
          git restore .

      - name: Sync commerce extension
        run: |
          cd ./.tmp/movedata-support
          git checkout extension/commerce
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./extension/commerce/
          cd movedata-support
          git restore .

      - name: Sync Non-Profit Cloud extension
        run: |
          cd ./.tmp/movedata-support
          git checkout extension/non-profit-cloud
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./extension/non-profit-cloud/
          cd movedata-support
          git restore .

      - name: Sync commerce schema
        run: |
          cd ./.tmp/movedata-support
          git checkout schema/commerce
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./schema/commerce/
          cd movedata-support
          git restore .

      - name: Sync donation schema
        run: |
          cd ./.tmp/movedata-support
          git checkout schema/donation
          cd ..
          node ./bin/convert-hints.js ./movedata-support
          node ./bin/convert-metadata.js ./movedata-support
          node ./bin/generate-metadata-aws.js ./movedata-support
          rsync -av --include='*/' --include='*.md' --include='*.metadata.json' --exclude='*' movedata-support/ ./schema/donation/
          cd movedata-support
          git restore .

      - name: Clean up cloned repository
        run: |
          rm -rf ./.tmp/movedata-support
          rm -rf ./.tmp/bin

      #- name: Clear existing S3 content
      #  run: |
      #    aws s3 rm s3://${{ env.ENVIRONMENT }}-movedata-ai/support/ --recursive
      #  env:
      #    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #    AWS_REGION: ap-southeast-2

      - name: Sync to S3
        run: |
          aws s3 sync ./.tmp s3://${{ env.ENVIRONMENT }}-movedata-ai/support/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2

      - name: Execute Bedrock Knowledge Base Data Source Sync
        run: |
          echo "Starting Bedrock Knowledge Base ingestion job..."
          INGESTION_JOB_ID=$(aws bedrock-agent start-ingestion-job \
            --knowledge-base-id ${{ env.KNOWLEDGE_BASE_ID }} \
            --data-source-id ${{ env.KNOWLEDGE_BASE_DATA_SOURCE_ID }} \
            --query 'ingestionJob.ingestionJobId' \
            --output text)
          
          echo "Ingestion job started with ID: $INGESTION_JOB_ID"
          echo "Waiting for ingestion job to complete..."
          
          # Poll the job status until completion
          while true; do
            STATUS=$(aws bedrock-agent get-ingestion-job \
              --knowledge-base-id ${{ env.KNOWLEDGE_BASE_ID }} \
              --data-source-id ${{ env.KNOWLEDGE_BASE_DATA_SOURCE_ID }} \
              --ingestion-job-id $INGESTION_JOB_ID \
              --query 'ingestionJob.status' \
              --output text)
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "COMPLETE" ]; then
              echo "✅ Ingestion job completed successfully!"
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "❌ Ingestion job failed!"
              exit 1
            elif [ "$STATUS" = "STOPPING" ] || [ "$STATUS" = "STOPPED" ]; then
              echo "⚠️ Ingestion job was stopped!"
              exit 1
            fi
            
            echo "Job still in progress, waiting 30 seconds..."
            sleep 30
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2