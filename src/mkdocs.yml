site_name: MoveData
site_url: https://support.movedata.io
theme:
  name: material
  palette:
    scheme: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
  logo: assets/logo.svg
extra_css:
  - assets/stylesheets/ask-ai-modal.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/tables.css
  - assets/stylesheets/file-download.css
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
extra_javascript:
  - https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js
  - assets/javascript/ask-ai-modal.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
nav:
  - Home: index.md
  - Knowledge: search.md
